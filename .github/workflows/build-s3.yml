
name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Patch CMake Dependencies & Configure
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          # Skrip python untuk menyuntikkan dependensi 'esp_eth' secara resmi ke semua komponen CMake
          cat << 'EOF' > patch_cmake.py
          import glob
          for path in glob.glob('components/*/CMakeLists.txt') + ['main/CMakeLists.txt']:
              try:
                  with open(path, 'r') as f: c = f.read()
                  if 'idf_component_register' in c and 'esp_eth' not in c:
                      if 'REQUIRES ' in c:
                          c = c.replace('REQUIRES ', 'REQUIRES esp_eth ')
                      elif 'PRIV_REQUIRES ' in c:
                          c = c.replace('PRIV_REQUIRES ', 'PRIV_REQUIRES esp_eth ')
                      else:
                          c = c.replace('idf_component_register(', 'idf_component_register(REQUIRES esp_eth ')
                      with open(path, 'w') as f: f.write(c)
              except: pass
          EOF
          python patch_cmake.py

          # Bersihkan riwayat build gagal sebelumnya
          rm -rf build sdkconfig

          # Konfigurasi mutlak untuk S3 N16R8 + CSpot (Spotify) + Matikan Ethernet Hardware
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=n
          EOF

          idf.py set-target esp32s3
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Compile Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
