name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Squeezelite Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Dependencies and Config
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install \
            "protobuf==4.25.6" \
            "grpcio-tools==1.62.3"

          # 1. Buat stub esp_eth.h agar kompiler tidak mengeluh fatal error jika header tidak terdeteksi
          mkdir -p components/wifi-manager/include
          cat << 'EOF' > components/wifi-manager/include/esp_eth.h
          #ifndef ESP_ETH_H
          #define ESP_ETH_H
          #endif
          EOF

          # 2. Patch CMakeLists wifi-manager untuk mendaftarkan esp_eth
          if [ -f components/wifi-manager/CMakeLists.txt ]; then
            sed -i 's/PRIV_REQUIRES/PRIV_REQUIRES esp_eth/g' components/wifi-manager/CMakeLists.txt || true
            sed -i 's/REQUIRES/REQUIRES esp_eth/g' components/wifi-manager/CMakeLists.txt || true
          fi

          # 3. Bersihkan build/config lama
          rm -rf build sdkconfig

          # 4. Konfigurasi ESP32-S3 N16R8
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=n
          EOF

          # Set target ESP32-S3
          idf.py set-target esp32s3

          # Tambahkan dukungan C++ exceptions untuk CSpot
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          echo "=== ESP-IDF VERSION ==="
          idf.py --version

          echo "=== TARGET ==="
          grep 'CONFIG_IDF_TARGET=' sdkconfig

          echo "=== BUILD ==="
          idf.py build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
