name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Squeezelite Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Patch Ethernet Out For ESP32-S3
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          # 1. Hapus #include esp_eth.h dari seluruh kode
          find components/wifi-manager/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '/#include.*esp_eth\.h/d' {} +

          # 2. Netralkan file network_ethernet.c agar tidak dicompile fungsinya
          cat << 'EOF' > components/wifi-manager/network_ethernet.c
          // Ethernet disabled for ESP32-S3 build
          #include "esp_err.h"
          void network_ethernet_init(void) {}
          void network_ethernet_start(void) {}
          void network_ethernet_stop(void) {}
          EOF

          # 3. Bersihkan build/config lama
          rm -rf build sdkconfig

          # 4. Konfigurasi ESP32-S3 N16R8
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=n
          EOF

          # Set target ke ESP32-S3
          idf.py set-target esp32s3

          # Tambahkan dukungan C++ exceptions untuk CSpot
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          echo "=== ESP-IDF VERSION ==="
          idf.py --version

          echo "=== BUILD ==="
          idf.py build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
