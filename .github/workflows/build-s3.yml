name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Fix Dependencies and Config
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          # 1. HANYA salin header esp_eth bawaan ESP-IDF ke folder wifi-manager.
          # JANGAN menghapus/memodifikasi file .c atau .h milik Squeezelite agar strukturnya utuh.
          cp -r $IDF_PATH/components/esp_eth/include/* components/wifi-manager/
          
          # Bersihkan cache dari build sebelumnya
          rm -rf build sdkconfig
          
          # 2. Konfigurasi ESP32-S3 N16R8 (Octal PSRAM) dan pancing library Ethernet
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=y
          EOF

          # Set target chip
          idf.py set-target esp32s3
          
          # 3. Suntik flag C++ Exception yang diwajibkan oleh Squeezelite
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Compile Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
