name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Hard-Bypass Ethernet Dependencies
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          # 1. BYPASS CMAKE: Salin paksa semua header Ethernet resmi ESP-IDF ke folder wifi-manager
          cp $IDF_PATH/components/esp_eth/include/* components/wifi-manager/

          # 2. Hapus isi file driver Ethernet fisik agar tidak memicu error EMAC S3 saat proses Linking
          find components/wifi-manager/ -type f -name "network_driver_*.c" -exec sh -c 'echo "// Disabled for S3" > "$1"' _ {} \;
          echo '// Disabled for S3' > components/wifi-manager/network_ethernet.c

          # 3. Suntikkan fungsi dummy agar sistem utama Squeezelite tidak mencari driver Ethernet
          cat << 'EOF' > components/wifi-manager/network_ethernet.h
          #ifndef NETWORK_ETHERNET_H
          #define NETWORK_ETHERNET_H
          #include "esp_err.h"
          typedef void* esp_eth_handle_t;
          static inline void network_ethernet_init(void) {}
          static inline void network_ethernet_start(void) {}
          static inline void network_ethernet_stop(void) {}
          #endif
          EOF

          # 4. Bersihkan cache dan setup S3
          rm -rf build sdkconfig
          
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=n
          EOF

          idf.py set-target esp32s3
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
