name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Squeezelite Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Dependencies and Config
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          # Pasang dependensi python versi spesifik untuk ESP-IDF 4.4.8
          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          # Bersihkan build sebelumnya jika ada
          rm -rf build sdkconfig

          # Buat sdkconfig bawaan khusus ESP32-S3 N16R8
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_ETH_USE_ESP32_EMAC=n
          CONFIG_ETH_USE_SPI_ETHERNET=n
          EOF

          idf.py set-target esp32s3

      - name: Build Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # Parameter DEPTH=32 sesuai rekomendasi build S3
          idf.py build -DDEPTH=32

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
